# 공고콕 정적 서빙 — edge-caddy(공용 엣지) 뒤에서 HTTP만 받는다. TLS·도메인은 엣지 몫.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;          # 엣지 뒤에서 :80 리다이렉트 방지(/g/x → /g/x/ 상대 경로)
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    # 퍼널 계측 비콘(가상 페이지뷰) — 본문 없이 204, 접근 로그로만 센다. 쿼리(입력값) 없음.
    location ^~ /intent/ { access_log /var/log/nginx/intent.log; return 204; }

    location / {
        # Vercel trailingSlash:true 와 같게 — 디렉터리 페이지는 슬래시로 301, 목록 없는 디렉터리는 404
        if (-f $request_filename/index.html) { rewrite ^(.*[^/])$ $1/ permanent; }
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=300";
    }
    location ~* \.(png|svg|ico|webp)$ { add_header Cache-Control "public, max-age=86400"; }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
