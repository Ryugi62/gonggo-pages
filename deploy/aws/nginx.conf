# 공고콕 정적 서빙 — edge-caddy(공용 엣지) 뒤에서 HTTP만 받는다. TLS·도메인은 엣지 몫.
# 이 파일은 conf.d 로 들어가 http 문맥에서 읽힌다(log_format·limit_req_zone 여기 둔다).

# 결제 요청 저장(SPEC §12 P3) — 새 프로세스 없이 nginx가 요청 본문을 JSON 한 줄로 남긴다.
# $request_body 는 본문을 읽는 모듈(proxy_pass)이 있어야 채워진다 → 같은 컨테이너 안 127.0.0.1:8081 로 넘겨 204.
log_format pro_request escape=json '{"t":"$time_iso8601","body":"$request_body"}';
# 엣지(caddy)가 붙이는 X-Forwarded-For = 방문자 IP 기준 분당 5회
limit_req_zone $http_x_forwarded_for zone=proreq:1m rate=5r/m;
# 저장된 요청(204)만 남긴다 — 거절(403 GET·413 큰 본문·429 속도 제한)은 빈 줄이 되므로 쓰지 않는다
# 계측 비콘 — 엣지 뒤라 $remote_addr 는 엣지 IP다. 방문자 IP(X-Forwarded-For)를 남겨 고유 방문·자체 검증 제외를 센다
log_format intent '$time_iso8601 $http_x_forwarded_for "$request" $status "$http_referer" "$http_user_agent"';
map $status $pro_saved { 204 1; default 0; }

server {
    listen 127.0.0.1:8081;
    access_log off;
    location / { return 204; }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;          # 엣지 뒤에서 :80 리다이렉트 방지(/g/x → /g/x/ 상대 경로)
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    # 퍼널 계측 비콘(가상 페이지뷰) — 본문 없이 204, 접근 로그로만 센다. 쿼리(입력값) 없음. 로그는 호스트 디렉터리(재배포에도 보존).
    location ^~ /intent/ { access_log /var/log/gonggo/intent.log intent; return 204; }

    # 결제 요청(돈 0) 저장 — POST JSON ≤ 1KB, 같은 IP 분당 5회(버스트 3), 호스트 logs/pro-requests.jsonl
    location = /api/pro-request {
        limit_except POST { deny all; }
        client_max_body_size 1k;
        client_body_buffer_size 1k;
        limit_req zone=proreq burst=3 nodelay;
        limit_req_status 429;
        access_log /var/log/gonggo/pro-requests.jsonl pro_request if=$pro_saved;
        proxy_pass http://127.0.0.1:8081;
    }

    location / {
        # Vercel trailingSlash:true 와 같게 — 디렉터리 페이지는 슬래시로 301, 목록 없는 디렉터리는 404
        if (-f $request_filename/index.html) { rewrite ^(.*[^/])$ $1/ permanent; }
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=300";
    }
    # 마감 캘린더 피드(SPEC §11) — 캘린더 앱이 주기적으로 가져간다. 요청 수는 엣지 접근 로그(UA)로 센다.
    location ~* \.ics$ { types { } default_type "text/calendar; charset=utf-8"; add_header Cache-Control "public, max-age=3600"; }
    location ~* \.(png|svg|ico|webp)$ { add_header Cache-Control "public, max-age=86400"; }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
